name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Skip sfw's periodic update check: it makes the same unauthenticated GitHub
  # API call that the bootstrap step below retries.
  SFW_SKIP_UPDATE_CHECK: "1"

jobs:
  verify:
    name: Lint, typecheck, unit, build, audit, consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g sfw@2.0.6
      - name: Verify Socket Firewall
        run: bash scripts/verify-sfw.sh
      - run: sfw npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: sfw npm audit
      - run: npm run test:consumer

  bun:
    name: Extension loading (Bun 1.3.14)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g sfw@2.0.6
      - name: Verify Socket Firewall
        run: bash scripts/verify-sfw.sh
      - run: sfw npm ci
      # Bun enables jiti's native import fast-path, so this is the only runner
      # that catches a top-level-await entrypoint regression.
      - run: npm run test:bun

  integration:
    name: Integration (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install -g sfw@2.0.6
      - name: Verify Socket Firewall
        run: bash scripts/verify-sfw.sh
      - run: sfw npm ci
      - run: npm run build
      - run: npm run test:integration
