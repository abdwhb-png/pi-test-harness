name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Skip sfw's periodic update check: it is the same unauthenticated GitHub API
  # call that makes a cold bootstrap fail. With a warm binary cache (see the
  # cache step in each job) the bootstrap makes no network call at all.
  SFW_SKIP_UPDATE_CHECK: "1"

jobs:
  verify:
    name: Lint, typecheck, unit, build, audit, consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # Install into the workspace so sfw's binary cache lands inside it, where
      # actions/cache can persist it — there is no ~/.sfw-cache to cache.
      - name: Install Socket Firewall
        run: |
          npm install -g sfw@2.0.6 \
            --prefix "${{ github.workspace }}/.sfw-tools"
      - name: Put Socket Firewall on PATH
        run: |
          # npm shims live in bin/ on POSIX, in the prefix root on Windows.
          echo "${{ github.workspace }}/.sfw-tools/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/.sfw-tools" >> "$GITHUB_PATH"
      # Ordered after the install so a restore cannot be wiped by it; the single
      # documented cache step saves in its post-step. A warm cache is what stops
      # sfw needing the network at all.
      - name: Cache Socket Firewall binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .sfw-tools/lib/node_modules/sfw/.sfw-cache
            .sfw-tools/node_modules/sfw/.sfw-cache
          key: sfw-${{ runner.os }}-${{ runner.arch }}-2.0.6
      - name: Verify Socket Firewall
        run: bash scripts/verify-sfw.sh
      - run: sfw npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: sfw npm audit
      - run: npm run test:consumer

  bun:
    name: Extension loading (Bun 1.3.14)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # Install into the workspace so sfw's binary cache lands inside it, where
      # actions/cache can persist it — there is no ~/.sfw-cache to cache.
      - name: Install Socket Firewall
        run: |
          npm install -g sfw@2.0.6 \
            --prefix "${{ github.workspace }}/.sfw-tools"
      - name: Put Socket Firewall on PATH
        run: |
          # npm shims live in bin/ on POSIX, in the prefix root on Windows.
          echo "${{ github.workspace }}/.sfw-tools/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/.sfw-tools" >> "$GITHUB_PATH"
      # Ordered after the install so a restore cannot be wiped by it; the single
      # documented cache step saves in its post-step. A warm cache is what stops
      # sfw needing the network at all.
      - name: Cache Socket Firewall binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .sfw-tools/lib/node_modules/sfw/.sfw-cache
            .sfw-tools/node_modules/sfw/.sfw-cache
          key: sfw-${{ runner.os }}-${{ runner.arch }}-2.0.6
      - name: Verify Socket Firewall
        run: bash scripts/verify-sfw.sh
      - run: sfw npm ci
      # Bun enables jiti's native import fast-path, so this is the only runner
      # that catches a top-level-await entrypoint regression.
      - run: npm run test:bun

  integration:
    name: Integration (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Install into the workspace so sfw's binary cache lands inside it, where
      # actions/cache can persist it — there is no ~/.sfw-cache to cache.
      - name: Install Socket Firewall
        run: |
          npm install -g sfw@2.0.6 \
            --prefix "${{ github.workspace }}/.sfw-tools"
      - name: Put Socket Firewall on PATH
        run: |
          # npm shims live in bin/ on POSIX, in the prefix root on Windows.
          echo "${{ github.workspace }}/.sfw-tools/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/.sfw-tools" >> "$GITHUB_PATH"
      # Ordered after the install so a restore cannot be wiped by it; the single
      # documented cache step saves in its post-step. A warm cache is what stops
      # sfw needing the network at all.
      - name: Cache Socket Firewall binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .sfw-tools/lib/node_modules/sfw/.sfw-cache
            .sfw-tools/node_modules/sfw/.sfw-cache
          key: sfw-${{ runner.os }}-${{ runner.arch }}-2.0.6
      - name: Verify Socket Firewall
        run: bash scripts/verify-sfw.sh
      - run: sfw npm ci
      - run: npm run build
      - run: npm run test:integration
