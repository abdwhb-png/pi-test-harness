name: Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing: the publish step exchanges this job's
  # OIDC identity for a short-lived registry credential, so no NPM_TOKEN exists.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g sfw@2.0.6
      - run: sfw --version
      - name: Install dependencies
        id: install
        run: sfw npm ci
      - name: Build release artifacts
        id: build
        run: npm run build
      - name: Check whether the target version is already on npm
        id: npm_before
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`;
          const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm preflight failed: HTTP ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.status === 200}\nname=${name}\nversion=${version}\n`);
          NODE

      # With pending changesets this opens/updates the "chore: version packages"
      # PR. Run it again after merging that PR: nothing is left to version, so
      # this step publishes the packed package to npm instead.
      - name: Create version PR or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2, Changesets CLI 3
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          publish-script: npm run release
          # The explicit step below owns remote tags and GitHub Releases.
          create-github-releases: false
          push-git-tags: false
          push-with-git-cli: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag vX.Y.Z and create the GitHub Release
        id: github_release
        # Already-published versions need metadata recovery at their original commit.
        if: steps.changesets.outputs.published == 'true' && steps.npm_before.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if git rev-parse --verify --quiet "$TAG" >/dev/null; then
            echo "Tag $TAG already exists; leaving it in place."
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "release=existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prefer the curated CHANGELOG entry over GitHub's PR-derived notes;
          # fall back when a release has no section of its own yet.
          if node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
          const start = lines.findIndex((l) => l.trim() === `## ${version}`);
          if (start === -1) process.exit(1);
          const rest = lines.slice(start + 1);
          const end = rest.findIndex((l) => l.startsWith("## "));
          const body = (end === -1 ? rest : rest.slice(0, end)).join("\n");
          writeFileSync(".release-notes.md", `${body.trim()}\n`);
          NODE
          then
            gh release create "$TAG" --title "$TAG" \
              --notes-file .release-notes.md
          else
            echo "No CHANGELOG section for $VERSION; using generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          echo "release=created" >> "$GITHUB_OUTPUT"
      - name: Write release summary
        if: ${{ always() }}
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
          RELEASE_STEPS: ${{ toJSON(steps) }}
        run: node scripts/release-summary.mjs
