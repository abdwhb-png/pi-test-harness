name: Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing: the publish step exchanges this job's
  # OIDC identity for a short-lived registry credential, so no NPM_TOKEN exists.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g sfw@2.0.6
      - run: sfw --version
      - run: sfw npm ci
      - run: npm run build

      # With pending changesets this opens/updates the "chore: version packages"
      # PR. Run it again after merging that PR: nothing is left to version, so
      # this step publishes the packed package to npm instead.
      - name: Create version PR or publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          publish: npm run release
          # One GitHub Release per version, created from the vX.Y.Z tag below
          # rather than duplicating it under changesets' package-scoped tag.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag vX.Y.Z and create the GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if git rev-parse --verify --quiet "$TAG" >/dev/null; then
            echo "Tag $TAG already exists; leaving it in place."
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          # Prefer the curated CHANGELOG entry over GitHub's PR-derived notes;
          # fall back when a release has no section of its own yet.
          if node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
          const start = lines.findIndex((l) => l.trim() === `## ${version}`);
          if (start === -1) process.exit(1);
          const rest = lines.slice(start + 1);
          const end = rest.findIndex((l) => l.startsWith("## "));
          const body = (end === -1 ? rest : rest.slice(0, end)).join("\n");
          writeFileSync(".release-notes.md", `${body.trim()}\n`);
          NODE
          then
            gh release create "$TAG" --title "$TAG" \
              --notes-file .release-notes.md
          else
            echo "No CHANGELOG section for $VERSION; using generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
